<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>C&F</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:#ffd6e4;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#c84b80;
}
#container{
  background:rgba(255,255,255,0.65);
  padding:40px 28px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 8px 30px rgba(200,75,128,0.2);
  margin:16px;
  z-index:10;
  transition: opacity 0.6s ease;
}
.title{
  font-size:26px;
  margin-bottom:24px;
  font-weight:bold;
}
.time-text{
  font-size:28px;
  font-weight:bold;
  line-height:1.8;
}

/* 飘落爱心 */
.heart{
  position:fixed;
  top:-60px;
  z-index:2;
  pointer-events:auto;
  cursor:pointer;
  animation:fall linear forwards;
  user-select:none;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}

/* 点击爱心弹出文字弹窗 */
#popup-box{
  position:fixed;
  left:0;
  top:0;
  width:100vw;
  height:100vh;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
}
#popup-text{
  font-family:"STXingkai","华文行楷", "KaiTi", "行书",serif;
  font-size:32px;
  line-height:2.4;
  text-align:center;
  max-width:88%;
  opacity:0;
  transition: opacity 1.2s ease;
}

/*炸开粒子*/
.particle{
  position:fixed;
  pointer-events:none;
  font-size:22px;
  z-index:99;
  animation:burst 0.7s ease-out forwards;
}
@keyframes burst{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}
}
</style>
</head>
<body>
<div id="container">
  <div class="title">💗 C&F 💗</div>
  <div class="time-text" id="timer"></div>
</div>

<!-- 点击爱心弹出文字层 -->
<div id="popup-box">
  <div id="popup-text"></div>
</div>

<script>
// 计时起始时间
const startTime = new Date("2026-03-29T10:30:00+08:00").getTime();

// 文案池
const sentenceList = [
  "想和你在一个慢下来的世界里交谈",
  "我对永恒有着致命的追求，可没有什么是永恒的，当我接受当下时，当下就是永恒",
  "春天苏州河畔会开满雪柳",
  "有些相遇第一眼就写好了结局",
  "我记性不好，会忘记很多事，但唯独会常常想起你",
  "海边，夕阳，单车，我，你",
  "希望我能越来越好，你也是"
];

//马卡龙柔和色系
const heartColors = [
  "#FFB6C1", "#FFD1DC", "#B5EAD7", "#C7CEEA", "#FFDAC1",
  "#F8C8DC", "#D4A5A5", "#92C9B1", "#A8DADC", "#F7D9C4",
  "#E2C0E8", "#BFD7EA"
];

const containerDom = document.getElementById("container");
//计时器更新
function updateTimer(){
  const now = Date.now();
  let diff = now - startTime;
  if(diff < 0){
    document.getElementById("timer").innerText = "还未开始";
    return;
  }
  const day = Math.floor(diff / (1000 * 60 * 60 * 24));
  diff = diff % (1000 * 60 * 60 * 24);
  const hour = Math.floor(diff / (1000 * 60 * 60));
  diff = diff % (1000 * 60 * 60);
  const min = Math.floor(diff / (1000 * 60));
  diff = diff % (1000 * 60);
  const sec = Math.floor(diff / 1000);

  document.getElementById("timer").innerText =
    `${day} 天 ${hour} 小时 ${min} 分 ${sec} 秒`;
}
updateTimer();
setInterval(updateTimer, 1000);


//弹窗元素
const popupBox = document.getElementById('popup-box');
const popupTextDom = document.getElementById('popup-text');

//文字淡入
async function showFadeText(text,color){
  popupTextDom.style.color = color;
  popupTextDom.innerText = text;
  popupTextDom.style.opacity = 0;
  popupBox.style.display = 'flex';
  //隐藏计时器
  containerDom.style.opacity = "0";
  //慢淡入
  await new Promise(resolve=>{
    setTimeout(()=>{
      popupTextDom.style.opacity = "1";
      setTimeout(resolve,1200);
    },50);
  })
}

//文字淡出关闭
async function closePopup(){
  popupTextDom.style.opacity = "0";
  await new Promise(resolve=>setTimeout(resolve,1200));
  popupBox.style.display = 'none';
  popupTextDom.innerText = '';
  //恢复计时器
  containerDom.style.opacity = "1";
}
//点击屏幕关闭弹窗
popupBox.addEventListener('click',async ()=>{
  await closePopup();
});


//爱心炸开粒子特效
function createBurst(x,y,color){
  for(let i=0;i<10;i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.innerHTML = "❤";
    p.style.color = color;
    p.style.left = x + "px";
    p.style.top = y + "px";
    const tx = (Math.random()-0.5)*160;
    const ty = (Math.random()-0.5)*160;
    p.style.setProperty('--tx',tx+"px");
    p.style.setProperty('--ty',ty+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}

//生成飘落爱心
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  //马卡龙随机颜色
  const ranColor = heartColors[Math.floor(Math.random()*heartColors.length)];
  heart.style.color = ranColor;
  //随机大小
  const fontSize = 32 + Math.random()*42;
  heart.style.fontSize = fontSize + "px";
  heart.style.left = Math.random()*94 + "vw";
  //下落随机时长
  const fallDur = 5 + Math.random()*7;
  heart.style.animationDuration = fallDur+"s";
  document.body.appendChild(heart);

  //点击爱心事件：炸开特效，淡入文字，停留，淡出消失
  heart.onclick = async function(e){
    e.stopPropagation();
    const rect = heart.getBoundingClientRect();
    createBurst(rect.left+rect.width/2, rect.top+rect.height/2, ranColor);
    const randomSentence = sentenceList[Math.floor(Math.random()*sentenceList.length)];
    await showFadeText(randomSentence, ranColor);
    //文字完整显示后停留 5秒，再淡出消失
    setTimeout(async ()=>{
      await closePopup();
    },5000);
  }

  setTimeout(()=>{
    heart.remove();
  }, fallDur*1000 + 200);
}

//生成爱心间隔随机
setInterval(createHeart, 550);

</script>
</body>
</html>
