<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>C&F</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
/*页面容器，支持渐入渐出切换*/
.page{
  position:absolute;
  width:100vw;
  height:100vh;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.8s ease;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.page.active{
  opacity:1;
  pointer-events:auto;
}

/*第一页样式*/
#page1{
  background:#ffd6e4;
  color:#c84b80;
}
#container{
  background:rgba(255,255,255,0.65);
  padding:40px 28px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 8px 30px rgba(200,75,128,0.2);
  margin:16px;
  z-index:10;
  transition: opacity 0.6s ease;
}
.title{
  font-size:26px;
  margin-bottom:24px;
  font-weight:bold;
}
.time-text{
  font-size:28px;
  font-weight:bold;
  line-height:1.8;
}

/*页面跳转按钮通用*/
.page-btn{
  position:fixed;
  bottom:40px;
  z-index:20;
  padding:12px 28px;
  border-radius:999px;
  border:none;
  background:#ffffff88;
  font-size:17px;
  cursor:pointer;
  backdrop-filter:blur(4px);
}

/* =========背景音乐按钮 移到左上角 =========*/
.bgm-btn{
  position:fixed;
  left:20px;
  top:20px;
  z-index:25;
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.65);
  backdrop-filter:blur(4px);
  font-size:22px;
  cursor:pointer;
  display:none;
}

/* 飘落爱心 */
.heart{
  position:fixed;
  top:-60px;
  z-index:2;
  pointer-events:auto;
  cursor:pointer;
  animation:fall linear forwards;
  user-select:none;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}

/* 第一页弹窗 */
#popup-box{
  position:fixed;
  left:0;
  top:0;
  width:100vw;
  height:100vh;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
}
#popup-text{
  font-family:"STXingkai","华文行楷", "KaiTi", "行书",serif;
  font-size:32px;
  line-height:2.4;
  text-align:center;
  max-width:88%;
  opacity:0;
  transition: opacity 1.2s ease;
}

/*炸开粒子*/
.particle{
  position:fixed;
  pointer-events:none;
  font-size:22px;
  z-index:99;
  animation:burst 0.7s ease-out forwards;
}
@keyframes burst{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0);}
}

/* =========第二页========= */
#page2{
  /*使用背景图片，你替换图片地址即可*/
  background:url("bg.jpg");
  background-size:cover;
  background-position:center;
  overflow-y:auto;
  padding-bottom:140px;
}
/*信箱按钮*/
.mail-btn{
  position:absolute;
  bottom:120px;
  font-size:52px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(6px);
  border:none;
  border-radius:16px;
  padding:14px 20px;
  cursor:pointer;
  z-index:10;
}
/*密码输入弹窗*/
#password-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  z-index:115;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.pwd-card{
  background:#fff;
  border-radius:16px;
  padding:30px;
  max-width:340px;
  width:100%;
  text-align:center;
}
.pwd-card h3{
  margin-bottom:16px;
  color:#555;
}
.pwd-card input{
  width:100%;
  padding:12px;
  font-size:20px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:16px;
  text-align:center;
}
.pwd-buttons{
  display:flex;
  gap:12px;
}
.pwd-buttons button{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
  cursor:pointer;
}
.btn-confirm{
  background:#ffb74d;
  color:#fff;
}
.btn-cancel{
  background:#eee;
}

/*信件弹窗遮罩*/
#letter-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
#letter-card{
  background:#fff8f0;
  border-radius:20px;
  padding:36px 30px;
  max-width:620px;
  width:100%;
  max-height:80vh;
  overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,0.18);
}
.letter-header{
  font-size:16px;
  color:#886b58;
  margin-bottom:20px;
  text-align:right;
}
#letter-content{
  font-family:"SimSun","宋体",serif;
  font-size:18px;
  line-height:2;
  color:#443328;
  white-space:pre-wrap;
}
.close-letter{
  margin-top:24px;
  width:100%;
  padding:10px;
  border-radius:12px;
  border:0;
  background:#e9d8c9;
  font-size:16px;
  cursor:pointer;
}

/*========炸弹报数小游戏 巴什博弈========*/
.game-box{
  background:rgba(255,248,230,0.92);
  border-radius:22px;
  padding:24px 20px;
  max-width:640px;
  width:94%;
  box-shadow:0 6px 24px rgba(255,152,0,0.25);
}
.game-title{
  text-align:center;
  font-size:22px;
  color:#e66500;
  font-weight:bold;
  margin-bottom:12px;
}
.bomb-info{
  text-align:center;
  font-size:19px;
  margin-bottom:14px;
  color:#d84315;
  font-weight:bold;
}
.rule-btn-wrap{
  text-align:right;
  margin-bottom:10px;
}
.rule-btn{
  padding:4px 10px;
  border-radius:6px;
  border:1px solid #ffb74d;
  background:#fff2cc;
  font-size:14px;
  cursor:pointer;
}
.num-bar-wrap{
  overflow-x:auto;
  padding:8px 4px;
  background:#fff;
  border-radius:12px;
  margin-bottom:14px;
}
.num-bar{
  display:flex;
  gap:4px;
  min-width:max-content;
}
.num-item{
  width:42px;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:#ffe0b2;
  font-size:16px;
  cursor:pointer;
  user-select:none;
}
.num-item.player{
  background:#ff9800;
  color:white;
}
.num-item.computer{
  background:#f4511e;
  color:white;
}
.num-item.disabled{
  cursor:not-allowed;
  opacity:0.45;
}
.game-status{
  text-align:center;
  font-size:17px;
  margin-bottom:14px;
  min-height:24px;
}
.game-select-side{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:14px;
}
.game-select-side button{
  padding:10px 20px;
  border-radius:10px;
  border:none;
  background:#ffcc80;
  font-size:16px;
  cursor:pointer;
}
.game-reset-wrap{
  text-align:center;
}
.game-reset{
  padding:10px 22px;
  border-radius:10px;
  border:none;
  background:#f57c00;
  color:white;
  font-size:16px;
  cursor:pointer;
}
.game-password-hint{
  margin-top:12px;
  text-align:center;
  font-size:16px;
  color:#c0392b;
  font-weight:bold;
  display:none;
}

/*游戏规则弹窗*/
#rule-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  z-index:130;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.rule-card{
  background:#fffef5;
  border-radius:18px;
  max-width:520px;
  width:100%;
  max-height:70vh;
  overflow-y:auto;
  padding:24px;
}
.rule-card h3{
  text-align:center;
  color:#e66500;
  margin-bottom:14px;
}
.rule-card p{
  line-height:1.8;
  font-size:15px;
  color:#444;
}
.close-rule{
  width:100%;
  margin-top:16px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#ffcc80;
  cursor:pointer;
  font-size:16px;
}
</style>
</head>
<body>

<audio id="bgmAudio" loop preload="auto">
  <source src="周杰伦 - 最长的电影.mp3" type="audio/mpeg">

<button class="bgm-btn" id="bgmToggle">🔊</button>

<!--第一页：原有计时页面-->
<div id="page1" class="page active">
  <div id="container">
    <div class="title">💗 C&F 💗</div>
    <div class="time-text" id="timer"></div>
  </div>
  <button class="page-btn" id="toPage2">下一页 →</button>
</div>

<!--第二页：自定义背景图片页面-->
<div id="page2" class="page">
  <div class="game-box">
    <div class="game-title">💣炸弹数字报数游戏</div>
    <div class="bomb-info" id="bombInfo">炸弹数字：--</div>
    <div class="rule-btn-wrap">
      <button class="rule-btn" id="openRuleBtn">📖游戏规则</button>
    </div>
    <div class="num-bar-wrap">
      <div class="num-bar" id="numBar"></div>
    </div>
    <div class="game-status" id="gameStatus">请选择先手或者后手开始游戏</div>
    <div class="game-select-side" id="selectSideWrap">
      <button id="goFirst">我先手</button>
      <button id="goSecond">我后手</button>
    </div>
    <div class="game-reset-wrap">
      <button class="game-reset" id="gameReset">重新开始</button>
    </div>
    <div class="game-password-hint" id="passwordHint">信箱密码：0827</div>
  </div>

  <button class="mail-btn" id="mailOpen">📩</button>
  <button class="page-btn" id="toPage1">← 返回</button>
</div>

<!--游戏规则弹窗-->
<div id="rule-wrap">
  <div class="rule-card">
    <h3>📖游戏规则</h3>
    <p>两名玩家轮流报数，从数字1开始，每人每次可以报1‑2个连续数字。<br>
谁被迫报到炸弹数字，谁就输掉本局。<br><br>
1.开局随机生成10‑50之间的炸弹数字；<br>
2.你可以选择先手或者后手；<br>
3.每回合你可以点击数字，只能报1个或者连续2个数字；<br>
4.逼迫电脑报到炸弹数字即可胜利，胜利后解锁信箱密码。
    </p>
    <button class="close-rule" id="closeRuleBtn">了解了</button>
  </div>
</div>

<!--密码弹窗-->
<div id="password-wrap">
  <div class="pwd-card">
    <h3>请输入信箱密码</h3>
    <input type="password" id="pwdInput" placeholder="输入4位密码">
    <div class="pwd-buttons">
      <button class="btn-cancel" id="pwdCancel">取消</button>
      <button class="btn-confirm" id="pwdConfirm">确认</button>
    </div>
  </div>
</div>

<!--第一页爱心弹窗-->
<div id="popup-box">
  <div id="popup-text"></div>
</div>

<!--信件弹窗 来自2026‑08‑27的来信-->
<div id="letter-wrap">
  <div id="letter-card">
    <div class="letter-header">来自 2026‑08‑27 的来信</div>
    <div id="letter-content"></div>
    <button class="close-letter" id="closeLetter">关闭信件</button>
  </div>
</div>

<script>
// =========页面切换逻辑，带渐入渐出，切换第二页清除全部爱心dom========
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const allHeartList = ()=>document.querySelectorAll(".heart");

// =====背景音乐逻辑=====
const bgmAudio = document.getElementById('bgmAudio');
const bgmToggleBtn = document.getElementById('bgmToggle');
let bgmPlaying = false;

bgmToggleBtn.onclick = function(){
  if(bgmPlaying){
    bgmAudio.pause();
    bgmToggleBtn.innerText = "🔇";
    bgmPlaying = false;
  }else{
    bgmAudio.play().then(()=>{
      bgmToggleBtn.innerText = "🔊";
      bgmPlaying = true;
    }).catch(err=>{
      console.log("播放失败",err);
    })
  }
}

document.getElementById("toPage2").onclick = ()=>{
  //切换到第二页，清除所有飘落爱心
  allHeartList().forEach(h=>h.remove());
  page1.classList.remove("active");
  page2.classList.add("active");
  bgmToggleBtn.style.display = "block";
}
document.getElementById("toPage1").onclick = ()=>{
  page2.classList.remove("active");
  page1.classList.add("active");
  //回到第一页暂停音乐，隐藏音乐按钮
  bgmAudio.pause();
  bgmPlaying = false;
  bgmToggleBtn.innerText = "🔊";
  bgmToggleBtn.style.display = "none";
}

//====游戏规则弹窗====
const ruleWrap = document.getElementById("rule-wrap");
document.getElementById("openRuleBtn").onclick = ()=>{
  ruleWrap.style.display = "flex";
}
document.getElementById("closeRuleBtn").onclick = ()=>{
  ruleWrap.style.display = "none";
}

//=====信件内容【已更新为新文本】=====
const letterText = `我从来都没有拥有过什么，或者也可以说我失去的太多，我总是想用力地抓住什么，我哥送的一副耳机，小颖儿送的一个手链，我妈织的毛衣，又或者是一张朋友随手拍下的我的照片，这些所有承载着美好的事物，我都希望能永远拥有，一段关系的开始是美好的，我就希望永远都是这么美好，为了抓住这些美好，我会做出很多努力，我希望耳机手链毛衣永远不会坏，照片永远都保存下来，关系永远这么美好，可永远好像很难，我想尽力做到最好，因为我不想我失去的时候后悔，后悔为什么当时没有做好，如果我所珍视的这些注定都会消失，那我希望能它们能够停留的久一点，再多一些美好的瞬间，常用，常戴，常穿，常记录，常见面。`;
const letterWrap = document.getElementById("letter-wrap");
const letterContentDom = document.getElementById("letter-content");

//信箱点击，弹出密码输入框
document.getElementById("mailOpen").onclick = ()=>{
  document.getElementById("password-wrap").style.display = "flex";
  document.getElementById("pwdInput").value = "";
}
//密码确认
document.getElementById("pwdConfirm").onclick = ()=>{
  const inputVal = document.getElementById("pwdInput").value.trim();
  if(inputVal === "0827"){
    document.getElementById("password-wrap").style.display = "none";
    openLetter();
  }else{
    alert("密码错误，请重试");
  }
}
document.getElementById("pwdCancel").onclick = ()=>{
  document.getElementById("password-wrap").style.display = "none";
}

//打开信件逐字打印
async function openLetter(){
  letterWrap.style.display = "flex";
  letterContentDom.innerText = "";
  let idx = 0;
  await new Promise(resolve=>{
    const type = setInterval(()=>{
      if(idx < letterText.length){
        letterContentDom.innerText += letterText.charAt(idx);
        idx++;
      }else{
        clearInterval(type);
        resolve();
      }
    },75);
  })
}
document.getElementById("closeLetter").onclick = ()=>{
  letterWrap.style.display = "none";
  letterContentDom.innerText = "";
}

// =========第一页原有计时、爱心逻辑========
const startTime = new Date("2026-03-29T10:30:00+08:00").getTime();
const sentenceList = [
  "想和你在一个慢下来的世界里交谈",
  "我对永恒有着致命的追求，可没有什么是永恒的，当我接受当下时，当下就是永恒",
  "春天苏州河畔会开满雪柳",
  "有些相遇第一眼就写好了结局",
  "我记性不好，会忘记很多事，但唯独会常常想起你",
  "海边，夕阳，单车，我，你",
  "希望我能越来越好，你也是"
];
//马卡龙色系
const heartColors = [
  "#FFB6C1", "#FFD1DC", "#B5EAD7", "#C7CEEA", "#FFDAC1",
  "#F8C8DC", "#D4A5A5", "#92C9B1", "#A8DADC", "#F7D9C4",
  "#E2C0E8", "#BFD7EA"
];

const containerDom = document.getElementById("container");
function updateTimer(){
  const now = Date.now();
  let diff = now - startTime;
  if(diff < 0){
    document.getElementById("timer").innerText = "还未开始";
    return;
  }
  const day = Math.floor(diff / (1000 * 60 * 60 * 24));
  diff = diff % (1000 * 60 * 60 * 24);
  const hour = Math.floor(diff / (1000 * 60 * 60));
  diff = diff % (1000 * 60 * 60);
  const min = Math.floor(diff / (1000 * 60));
  diff = diff % (1000 * 60);
  const sec = Math.floor(diff / 1000);
  document.getElementById("timer").innerText = `${day} 天 ${hour} 小时 ${min} 分 ${sec} 秒`;
}
updateTimer();
setInterval(updateTimer, 1000);

const popupBox = document.getElementById('popup-box');
const popupTextDom = document.getElementById('popup-text');

async function showFadeText(text,color){
  popupTextDom.style.color = color;
  popupTextDom.innerText = text;
  popupTextDom.style.opacity = 0;
  popupBox.style.display = 'flex';
  containerDom.style.opacity = "0";
  await new Promise(resolve=>{
    setTimeout(()=>{
      popupTextDom.style.opacity = "1";
      setTimeout(resolve,1200);
    },50);
  })
}
async function closePopup(){
  popupTextDom.style.opacity = "0";
  await new Promise(resolve=>setTimeout(resolve,1200));
  popupBox.style.display = 'none';
  popupTextDom.innerText = '';
  containerDom.style.opacity = "1";
}
popupBox.addEventListener('click',async ()=>{
  await closePopup();
});

//爱心炸开
function createBurst(x,y,color){
  for(let i=0;i<10;i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.innerHTML = "❤";
    p.style.color = color;
    p.style.left = x + "px";
    p.style.top = y + "px";
    const tx = (Math.random()-0.5)*160;
    const ty = (Math.random()-0.5)*160;
    p.style.setProperty('--tx',tx+"px");
    p.style.setProperty('--ty',ty+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}

//生成飘落爱心，只在page1处于active时才生成
function createHeart(){
  if(!page1.classList.contains("active")) return;
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  const ranColor = heartColors[Math.floor(Math.random()*heartColors.length)];
  heart.style.color = ranColor;
  const fontSize = 32 + Math.random()*42;
  heart.style.fontSize = fontSize + "px";
  heart.style.left = Math.random()*94 + "vw";
  const fallDur = 5 + Math.random()*7;
  heart.style.animationDuration = fallDur+"s";
  document.body.appendChild(heart);

  heart.onclick = async function(e){
    e.stopPropagation();
    const rect = heart.getBoundingClientRect();
    createBurst(rect.left+rect.width/2, rect.top+rect.height/2, ranColor);
    const randomSentence = sentenceList[Math.floor(Math.random()*sentenceList.length)];
    await showFadeText(randomSentence, ranColor);
    setTimeout(async ()=>{
      await closePopup();
    },5000);
  }
  setTimeout(()=>{heart.remove();}, fallDur*1000 + 200);
}
setInterval(createHeart, 550);


//====================炸弹报数游戏（巴什博弈）====================
/*
游戏规则：
两名玩家轮流报数，从数字1开始，每人每次可以报1个或2个连续的数字，谁被迫报到炸弹数字谁就输。
关键数base = 1+2 = 3；目标抢到 bombNum‑1
*/
let bombNum = 0;         //炸弹数字
let currentNum = 0;      //当前报到到数字
let gameOver = false;
let isPlayerTurn = false;
let playerWin = false;

const bombInfoDom = document.getElementById("bombInfo");
const numBarDom = document.getElementById("numBar");
const gameStatusDom = document.getElementById("gameStatus");
const selectSideWrap = document.getElementById("selectSideWrap");
const passwordHintDom = document.getElementById("passwordHint");

//初始化一局游戏
function initGame(){
  //10~50随机炸弹数字
  bombNum = Math.floor(Math.random()*41)+10;
  currentNum = 0;
  gameOver = false;
  playerWin = false;
  isPlayerTurn = false;
  passwordHintDom.style.display = "none";

  bombInfoDom.innerText = `炸弹数字：${bombNum}🔴`;
  //渲染数字条
  renderNumberBar();
  gameStatusDom.innerText = "请选择先手或者后手开始游戏";
  selectSideWrap.style.display = "flex";
}

//渲染数字条
function renderNumberBar(){
  numBarDom.innerHTML = "";
  for(let i=1;i<=bombNum;i++){
    const span = document.createElement("div");
    span.className = "num-item";
    span.innerText = i;
    if(i <= currentNum){
      if(window._markPlayerSet && window._markPlayerSet.has(i)){
        span.classList.add("player");
      }else{
        span.classList.add("computer");
      }
    }
    //未到回合/已经报过/游戏结束，禁止点击
    if(!isPlayerTurn || i <= currentNum || gameOver){
      span.classList.add("disabled");
    }else{
      span.classList.remove("disabled");
      span.onclick = ()=>handleNumberClick(i);
    }
    numBarDom.appendChild(span);
  }
}

//玩家点击数字，只允许点击currentNum+1 或者 currentNum+2
async function handleNumberClick(clickNum){
  if(gameOver || !isPlayerTurn) return;
  const allow1 = currentNum + 1;
  const allow2 = currentNum + 2;
  if(clickNum !== allow1 && clickNum !== allow2){
    gameStatusDom.innerText = `只能点击 ${allow1} 或者 ${allow2}`;
    return;
  }
  const cnt = clickNum - currentNum;
  await playerCall(cnt);
}

//玩家选择先手
document.getElementById("goFirst").onclick = ()=>{
  selectSideWrap.style.display = "none";
  isPlayerTurn = true;
  window._markPlayerSet = new Set();
  gameStatusDom.innerText = "轮到你操作，请点击下一个或者下下一个数字";
  renderNumberBar();
}

//玩家选择后手，电脑先手
document.getElementById("goSecond").onclick = async ()=>{
  selectSideWrap.style.display = "none";
  window._markPlayerSet = new Set();
  isPlayerTurn = false;
  gameStatusDom.innerText = "电脑思考中...";
  renderNumberBar();
  await sleep(1000);
  computerTurn();
}

//休眠工具
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

//玩家报数逻辑
async function playerCall(cnt){
  let newEnd = currentNum + cnt;
  //标记玩家报的数字
  for(let i=currentNum+1;i<=newEnd;i++){
    window._markPlayerSet.add(i);
  }
  currentNum = newEnd;
  renderNumberBar();
  gameStatusDom.innerText = `你报到：${newEnd}`;

  //判断是否踩到炸弹
  if(currentNum >= bombNum){
    gameOver = true;
    playerWin = false;
    gameStatusDom.innerText = `游戏结束！你报到炸弹数字${bombNum}，你输了！加油哦~`;
    renderNumberBar();
    return;
  }
  isPlayerTurn = false;
  await sleep(1000);
  computerTurn();
}

//电脑回合，巴什博弈必胜策略
async function computerTurn(){
  if(gameOver) return;
  const target = bombNum - 1;
  let step;
  const remain = target - currentNum;
  const rem = remain % 3;
  if(rem > 0){
    step = rem;
  }else{
    //无法必胜，随机1~2
    step = Math.random()>0.5?1:2;
  }
  //防止越界
  if(currentNum + step > bombNum) step = 1;

  let newEnd = currentNum + step;
  //电脑报数，不加入玩家标记集合
  currentNum = newEnd;
  renderNumberBar();
  gameStatusDom.innerText = `电脑报到：${newEnd}`;

  if(currentNum >= bombNum){
    gameOver = true;
    playerWin = true;
    gameStatusDom.innerText = `🎉游戏结束！电脑报到炸弹数字${bombNum}，你赢啦！密码已解锁！`;
    passwordHintDom.style.display = "block";
    renderNumberBar();
    return;
  }
  isPlayerTurn = true;
  gameStatusDom.innerText = "轮到你操作，请点击下一个或者下下一个数字";
  renderNumberBar();
}

//重新开始按钮
document.getElementById("gameReset").onclick = ()=>{
  initGame();
}

//页面加载初始化游戏
initGame();

</script>
